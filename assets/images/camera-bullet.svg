<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
    <defs>
      <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#0A1324"/>
        <stop offset="55%" stop-color="#101D35"/>
        <stop offset="100%" stop-color="#162A4A"/>
      </linearGradient>
      <linearGradient id="metalBody" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#F8FAFC"/>
        <stop offset="55%" stop-color="#E2E8F0"/>
        <stop offset="100%" stop-color="#94A3B8"/>
      </linearGradient>
      <linearGradient id="cyanCone" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.48"/>
        <stop offset="60%" stop-color="#2563EB" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#2563EB" stop-opacity="0.0"/>
      </linearGradient>
      <radialGradient id="blueGlow" cx="50%" cy="45%" r="50%">
        <stop offset="0%" stop-color="#2563EB" stop-opacity="0.32"/>
        <stop offset="100%" stop-color="#101D35" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- Background Canvas -->
    <rect width="800" height="500" fill="url(#bgGrad)"/>
    <circle cx="420" cy="230" r="280" fill="url(#blueGlow)"/>

    <!-- Subtle Technical Grid -->
    <g stroke="#2563EB" stroke-opacity="0.1" stroke-width="1">
      <line x1="0" y1="80" x2="800" y2="80"/>
      <line x1="0" y1="160" x2="800" y2="160"/>
      <line x1="0" y1="240" x2="800" y2="240"/>
      <line x1="0" y1="320" x2="800" y2="320"/>
      <line x1="0" y1="400" x2="800" y2="400"/>
      <line x1="160" y1="0" x2="160" y2="500"/>
      <line x1="320" y1="0" x2="320" y2="500"/>
      <line x1="480" y1="0" x2="480" y2="500"/>
      <line x1="640" y1="0" x2="640" y2="500"/>
    </g>

    <!-- Top Telemetry HUD Bar -->
    <rect x="28" y="24" width="744" height="40" rx="8" fill="#091224" fill-opacity="0.78" stroke="#1E3A8A" stroke-width="1"/>
    <circle cx="50" cy="44" r="5" fill="#10B981"/>
    <text x="64" y="48" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">HARDWARE CATEGORY // 02</text>
    <text x="752" y="48" text-anchor="end" fill="#06B6D4" font-family="monospace" font-size="12" font-weight="600">UNBRANDED BULLET SERIES</text>

    <!-- Main Scene Graphic -->
    
      <g transform="translate(400, 235)">
        <!-- Articulated Wall Mount Arm -->
        <rect x="135" y="-50" width="38" height="100" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
        <path d="M55,-12 L135,-24 L135,24 L55,16 Z" fill="#334155" stroke="#64748B" stroke-width="2"/>
        <!-- Cylindrical Housing -->
        <g transform="rotate(8)">
          <rect x="-135" y="-48" width="210" height="96" rx="22" fill="url(#metalBody)" stroke="#94A3B8" stroke-width="2"/>
          <!-- Sunshield Top Cover -->
          <path d="M-152,-54 L70,-54 L82,-34 L-138,-34 Z" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
          <!-- Lens Aperture Front -->
          <ellipse cx="-128" cy="0" rx="26" ry="46" fill="#091122" stroke="#06B6D4" stroke-width="2.5"/>
          <circle cx="-128" cy="0" r="20" fill="#0F172A" stroke="#2563EB" stroke-width="2"/>
          <circle cx="-128" cy="0" r="9" fill="#06B6D4" fill-opacity="0.6"/>
          <circle cx="-132" cy="-5" r="4" fill="#FFFFFF"/>
        </g>
      </g>
    

    <!-- Bottom Caption & Technical Plate -->
    <rect x="28" y="412" width="744" height="64" rx="10" fill="#091224" fill-opacity="0.86" stroke="#1E3A8A" stroke-width="1.2"/>
    <text x="48" y="439" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">Bullet CCTV Camera</text>
    <text x="48" y="461" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Directional wall/pole-mounted cylindrical camera built for driveways and long corridors</text>
    <rect x="615" y="428" width="138" height="32" rx="6" fill="#2563EB" fill-opacity="0.2" stroke="#06B6D4" stroke-width="1"/>
    <text x="684" y="448" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="11" font-weight="700">LONG-RANGE VIEW</text>
  </svg>