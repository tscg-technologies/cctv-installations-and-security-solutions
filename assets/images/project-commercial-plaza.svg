<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
    <defs>
      <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#0A1324"/>
        <stop offset="55%" stop-color="#101D35"/>
        <stop offset="100%" stop-color="#162A4A"/>
      </linearGradient>
      <linearGradient id="metalBody" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#F8FAFC"/>
        <stop offset="55%" stop-color="#E2E8F0"/>
        <stop offset="100%" stop-color="#94A3B8"/>
      </linearGradient>
      <linearGradient id="cyanCone" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.48"/>
        <stop offset="60%" stop-color="#2563EB" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#2563EB" stop-opacity="0.0"/>
      </linearGradient>
      <radialGradient id="blueGlow" cx="50%" cy="45%" r="50%">
        <stop offset="0%" stop-color="#2563EB" stop-opacity="0.32"/>
        <stop offset="100%" stop-color="#101D35" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- Background Canvas -->
    <rect width="800" height="500" fill="url(#bgGrad)"/>
    <circle cx="420" cy="230" r="280" fill="url(#blueGlow)"/>

    <!-- Subtle Technical Grid -->
    <g stroke="#2563EB" stroke-opacity="0.1" stroke-width="1">
      <line x1="0" y1="80" x2="800" y2="80"/>
      <line x1="0" y1="160" x2="800" y2="160"/>
      <line x1="0" y1="240" x2="800" y2="240"/>
      <line x1="0" y1="320" x2="800" y2="320"/>
      <line x1="0" y1="400" x2="800" y2="400"/>
      <line x1="160" y1="0" x2="160" y2="500"/>
      <line x1="320" y1="0" x2="320" y2="500"/>
      <line x1="480" y1="0" x2="480" y2="500"/>
      <line x1="640" y1="0" x2="640" y2="500"/>
    </g>

    <!-- Top Telemetry HUD Bar -->
    <rect x="28" y="24" width="744" height="40" rx="8" fill="#091224" fill-opacity="0.78" stroke="#1E3A8A" stroke-width="1"/>
    <circle cx="50" cy="44" r="5" fill="#10B981"/>
    <text x="64" y="48" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">DEMO PROJECT // COMMERCIAL SECURITY</text>
    <text x="752" y="48" text-anchor="end" fill="#06B6D4" font-family="monospace" font-size="12" font-weight="600">SAMPLE PROJECT #102</text>

    <!-- Main Scene Graphic -->
    
      <!-- Modern Indian Commercial Building Perspective -->
      <g opacity="0.92">
        <!-- Glass Skyscraper Facade -->
        <polygon points="80,460 80,120 340,70 340,460" fill="#132544" stroke="#2563EB" stroke-width="1.5"/>
        <polygon points="340,70 540,130 540,460 340,460" fill="#0D1930" stroke="#1E3A8A" stroke-width="1.5"/>
        <!-- Architectural Glass Grid -->
        <g stroke="#2563EB" stroke-opacity="0.28" stroke-width="1">
          <line x1="130" y1="110" x2="130" y2="460"/>
          <line x1="185" y1="100" x2="185" y2="460"/>
          <line x1="240" y1="90" x2="240" y2="460"/>
          <line x1="290" y1="80" x2="290" y2="460"/>
          <line x1="80" y1="160" x2="340" y2="115"/>
          <line x1="80" y1="215" x2="340" y2="175"/>
          <line x1="80" y1="270" x2="340" y2="235"/>
          <line x1="80" y1="325" x2="340" y2="295"/>
          <line x1="80" y1="380" x2="340" y2="355"/>
          <line x1="390" y1="88" x2="390" y2="460"/>
          <line x1="445" y1="103" x2="445" y2="460"/>
          <line x1="500" y1="118" x2="500" y2="460"/>
          <line x1="340" y1="175" x2="540" y2="220"/>
          <line x1="340" y1="235" x2="540" y2="275"/>
          <line x1="340" y1="295" x2="540" y2="330"/>
        </g>
        <!-- Lit Office Windows -->
        <polygon points="185,158 240,148 240,192 185,202" fill="#06B6D4" fill-opacity="0.18"/>
        <polygon points="240,252 290,244 290,285 240,293" fill="#2563EB" fill-opacity="0.25"/>
        <polygon points="130,262 185,252 185,295 130,305" fill="#06B6D4" fill-opacity="0.14"/>
      </g>
      <!-- Optical Surveillance Scan Cone -->
      <polygon points="565,185 160,310 380,455" fill="url(#cyanCone)" opacity="0.55"/>
      <!-- Foreground Pro Bullet Surveillance Camera -->
      <g transform="translate(490, 110)">
        <!-- Wall Bracket & Junction Box -->
        <rect x="195" y="25" width="38" height="76" rx="6" fill="#1E293B" stroke="#475569" stroke-width="2"/>
        <path d="M145,62 L195,50 L195,78 L145,74 Z" fill="#334155" stroke="#64748B" stroke-width="1.5"/>
        <!-- Main Camera Cylinder Housing -->
        <g transform="rotate(14, 110, 65)">
          <rect x="20" y="32" width="135" height="62" rx="14" fill="url(#metalBody)" stroke="#94A3B8" stroke-width="1.5"/>
          <!-- Weather Sunshield Hood -->
          <path d="M8,28 L148,28 L158,42 L18,42 Z" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
          <!-- Dark Front Lens Bezel -->
          <ellipse cx="24" cy="63" rx="16" ry="30" fill="#091122" stroke="#06B6D4" stroke-width="2"/>
          <!-- Multi-element Optical Lens -->
          <circle cx="24" cy="63" r="12" fill="#0F172A" stroke="#2563EB" stroke-width="2"/>
          <circle cx="24" cy="63" r="6" fill="#06B6D4" fill-opacity="0.45"/>
          <circle cx="21" cy="60" r="2.5" fill="#FFFFFF" opacity="0.9"/>
          <!-- IR LED Ring Indicators -->
          <circle cx="24" cy="42" r="2" fill="#EF4444" opacity="0.85"/>
          <circle cx="24" cy="84" r="2" fill="#EF4444" opacity="0.85"/>
          <circle cx="14" cy="50" r="1.8" fill="#EF4444" opacity="0.75"/>
          <circle cx="14" cy="76" r="1.8" fill="#EF4444" opacity="0.75"/>
        </g>
      </g>
      <!-- Bounding Box Detection Reticle Over Building Entrance -->
      <g stroke="#06B6D4" stroke-width="1.5" fill="none" opacity="0.85">
        <rect x="200" y="330" width="110" height="85" stroke-dasharray="6 4"/>
        <path d="M200,342 V330 H212 M298,330 H310 V342 M310,403 V415 H298 M212,415 H200 V403" stroke-width="2.5"/>
        <rect x="200" y="308" width="96" height="18" rx="3" fill="#06B6D4" fill-opacity="0.2" stroke="none"/>
        <text x="206" y="320" fill="#22D3EE" font-family="system-ui, sans-serif" font-size="10" font-weight="700">ZONE A: PERIMETER</text>
      </g>
    

    <!-- Bottom Caption & Technical Plate -->
    <rect x="28" y="412" width="744" height="64" rx="10" fill="#091224" fill-opacity="0.86" stroke="#1E3A8A" stroke-width="1.2"/>
    <text x="48" y="439" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">Sample Commercial Complex Concourse & Parking</text>
    <text x="48" y="461" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Fictional Commercial Demo — Multi-floor entry points and basement parking surveillance</text>
    <rect x="615" y="428" width="138" height="32" rx="6" fill="#2563EB" fill-opacity="0.2" stroke="#06B6D4" stroke-width="1"/>
    <text x="684" y="448" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="11" font-weight="700">16 CAMERAS + NVR</text>
  </svg>