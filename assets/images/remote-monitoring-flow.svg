<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
    <defs>
      <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#0A1324"/>
        <stop offset="55%" stop-color="#101D35"/>
        <stop offset="100%" stop-color="#162A4A"/>
      </linearGradient>
      <linearGradient id="metalBody" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#F8FAFC"/>
        <stop offset="55%" stop-color="#E2E8F0"/>
        <stop offset="100%" stop-color="#94A3B8"/>
      </linearGradient>
      <linearGradient id="cyanCone" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.48"/>
        <stop offset="60%" stop-color="#2563EB" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#2563EB" stop-opacity="0.0"/>
      </linearGradient>
      <radialGradient id="blueGlow" cx="50%" cy="45%" r="50%">
        <stop offset="0%" stop-color="#2563EB" stop-opacity="0.32"/>
        <stop offset="100%" stop-color="#101D35" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- Background Canvas -->
    <rect width="800" height="500" fill="url(#bgGrad)"/>
    <circle cx="420" cy="230" r="280" fill="url(#blueGlow)"/>

    <!-- Subtle Technical Grid -->
    <g stroke="#2563EB" stroke-opacity="0.1" stroke-width="1">
      <line x1="0" y1="80" x2="800" y2="80"/>
      <line x1="0" y1="160" x2="800" y2="160"/>
      <line x1="0" y1="240" x2="800" y2="240"/>
      <line x1="0" y1="320" x2="800" y2="320"/>
      <line x1="0" y1="400" x2="800" y2="400"/>
      <line x1="160" y1="0" x2="160" y2="500"/>
      <line x1="320" y1="0" x2="320" y2="500"/>
      <line x1="480" y1="0" x2="480" y2="500"/>
      <line x1="640" y1="0" x2="640" y2="500"/>
    </g>

    <!-- Top Telemetry HUD Bar -->
    <rect x="28" y="24" width="744" height="40" rx="8" fill="#091224" fill-opacity="0.78" stroke="#1E3A8A" stroke-width="1"/>
    <circle cx="50" cy="44" r="5" fill="#10B981"/>
    <text x="64" y="48" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SYSTEM ARCHITECTURE // ILLUSTRATIVE FLOW</text>
    <text x="752" y="48" text-anchor="end" fill="#06B6D4" font-family="monospace" font-size="12" font-weight="600">REMOTE ACCESS ARCHITECTURE</text>

    <!-- Main Scene Graphic -->
    
      <!-- 4-Node End-to-End Architecture Flow -->
      <g transform="translate(45, 130)">
        <!-- Connection Lines -->
        <line x1="135" y1="105" x2="225" y2="105" stroke="#06B6D4" stroke-width="3" stroke-dasharray="8 6"/>
        <line x1="365" y1="105" x2="455" y2="105" stroke="#06B6D4" stroke-width="3" stroke-dasharray="8 6"/>
        <line x1="595" y1="105" x2="675" y2="105" stroke="#06B6D4" stroke-width="3" stroke-dasharray="8 6"/>

        <!-- Step 1: Camera Node -->
        <rect x="0" y="30" width="135" height="150" rx="14" fill="#132342" stroke="#2563EB" stroke-width="2"/>
        <circle cx="67" cy="85" r="28" fill="#091122" stroke="#06B6D4" stroke-width="2"/>
        <circle cx="67" cy="85" r="10" fill="#2563EB"/>
        <text x="67" y="142" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1. CCTV Camera</text>
        <text x="67" y="160" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Optical Video Capture</text>

        <!-- Step 2: DVR / NVR System -->
        <rect x="225" y="30" width="140" height="150" rx="14" fill="#132342" stroke="#2563EB" stroke-width="2"/>
        <rect x="250" y="68" width="90" height="32" rx="5" fill="#091122" stroke="#06B6D4" stroke-width="2"/>
        <circle cx="264" cy="84" r="4" fill="#10B981"/>
        <circle cx="278" cy="84" r="4" fill="#06B6D4"/>
        <line x1="296" y1="84" x2="328" y2="84" stroke="#475569" stroke-width="3"/>
        <text x="295" y="142" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2. DVR / NVR Unit</text>
        <text x="295" y="160" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Local Storage &amp; Encode</text>

        <!-- Step 3: Network Router -->
        <rect x="455" y="30" width="140" height="150" rx="14" fill="#132342" stroke="#2563EB" stroke-width="2"/>
        <path d="M500,72 Q525,48 550,72" stroke="#06B6D4" stroke-width="2.5" fill="none"/>
        <path d="M510,84 Q525,68 540,84" stroke="#2563EB" stroke-width="2.5" fill="none"/>
        <rect x="495" y="92" width="60" height="18" rx="4" fill="#091122" stroke="#64748B" stroke-width="1.5"/>
        <text x="525" y="142" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">3. Secure Network</text>
        <text x="525" y="160" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Encrypted Gateway</text>

        <!-- Step 4: Mobile / Desktop Viewing -->
        <rect x="665" y="30" width="110" height="150" rx="14" fill="#132342" stroke="#06B6D4" stroke-width="2"/>
        <rect x="695" y="52" width="50" height="72" rx="7" fill="#091122" stroke="#06B6D4" stroke-width="2"/>
        <line x1="695" y1="88" x2="745" y2="88" stroke="#1E3A8A" stroke-width="1"/>
        <line x1="720" y1="52" x2="720" y2="124" stroke="#1E3A8A" stroke-width="1"/>
        <text x="720" y="145" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">4. Live App View</text>
        <text x="720" y="162" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Authorized Devices</text>
      </g>
    

    <!-- Bottom Caption & Technical Plate -->
    <rect x="28" y="412" width="744" height="64" rx="10" fill="#091224" fill-opacity="0.86" stroke="#1E3A8A" stroke-width="1.2"/>
    <text x="48" y="439" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">How Remote CCTV Viewing Works Across Compatible Systems</text>
    <text x="48" y="461" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Requires compatible DVR/NVR hardware, active internet connectivity, and authorized device setup</text>
    <rect x="615" y="428" width="138" height="32" rx="6" fill="#2563EB" fill-opacity="0.2" stroke="#06B6D4" stroke-width="1"/>
    <text x="684" y="448" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="11" font-weight="700">ENCRYPTED STREAM</text>
  </svg>