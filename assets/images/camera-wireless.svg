<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
    <defs>
      <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#0A1324"/>
        <stop offset="55%" stop-color="#101D35"/>
        <stop offset="100%" stop-color="#162A4A"/>
      </linearGradient>
      <linearGradient id="metalBody" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#F8FAFC"/>
        <stop offset="55%" stop-color="#E2E8F0"/>
        <stop offset="100%" stop-color="#94A3B8"/>
      </linearGradient>
      <linearGradient id="cyanCone" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.48"/>
        <stop offset="60%" stop-color="#2563EB" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#2563EB" stop-opacity="0.0"/>
      </linearGradient>
      <radialGradient id="blueGlow" cx="50%" cy="45%" r="50%">
        <stop offset="0%" stop-color="#2563EB" stop-opacity="0.32"/>
        <stop offset="100%" stop-color="#101D35" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- Background Canvas -->
    <rect width="800" height="500" fill="url(#bgGrad)"/>
    <circle cx="420" cy="230" r="280" fill="url(#blueGlow)"/>

    <!-- Subtle Technical Grid -->
    <g stroke="#2563EB" stroke-opacity="0.1" stroke-width="1">
      <line x1="0" y1="80" x2="800" y2="80"/>
      <line x1="0" y1="160" x2="800" y2="160"/>
      <line x1="0" y1="240" x2="800" y2="240"/>
      <line x1="0" y1="320" x2="800" y2="320"/>
      <line x1="0" y1="400" x2="800" y2="400"/>
      <line x1="160" y1="0" x2="160" y2="500"/>
      <line x1="320" y1="0" x2="320" y2="500"/>
      <line x1="480" y1="0" x2="480" y2="500"/>
      <line x1="640" y1="0" x2="640" y2="500"/>
    </g>

    <!-- Top Telemetry HUD Bar -->
    <rect x="28" y="24" width="744" height="40" rx="8" fill="#091224" fill-opacity="0.78" stroke="#1E3A8A" stroke-width="1"/>
    <circle cx="50" cy="44" r="5" fill="#10B981"/>
    <text x="64" y="48" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">HARDWARE CATEGORY // 04</text>
    <text x="752" y="48" text-anchor="end" fill="#06B6D4" font-family="monospace" font-size="12" font-weight="600">UNBRANDED WIRELESS SERIES</text>

    <!-- Main Scene Graphic -->
    
      <g transform="translate(400, 240)">
        <!-- Dual High-Gain Antennas -->
        <rect x="-92" y="-135" width="12" height="115" rx="6" transform="rotate(-12 -86 -80)" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
        <rect x="80" y="-135" width="12" height="115" rx="6" transform="rotate(12 86 -80)" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
        <!-- Wireless Signal Waves -->
        <path d="M-45,-120 Q0,-155 45,-120" stroke="#06B6D4" stroke-width="2.5" fill="none"/>
        <path d="M-28,-100 Q0,-125 28,-100" stroke="#2563EB" stroke-width="2.5" fill="none"/>
        <!-- Smart Camera Body -->
        <rect x="-70" y="-55" width="140" height="115" rx="36" fill="url(#metalBody)" stroke="#94A3B8" stroke-width="2"/>
        <circle cx="0" cy="2" r="42" fill="#091122" stroke="#2563EB" stroke-width="2.5"/>
        <circle cx="0" cy="2" r="18" fill="#06B6D4" fill-opacity="0.45"/>
        <circle cx="-5" cy="-4" r="5" fill="#FFFFFF"/>
        <!-- Stand Base -->
        <path d="M-30,60 L-55,105 L55,105 L30,60 Z" fill="#334155" stroke="#64748B" stroke-width="2"/>
      </g>
    

    <!-- Bottom Caption & Technical Plate -->
    <rect x="28" y="412" width="744" height="64" rx="10" fill="#091224" fill-opacity="0.86" stroke="#1E3A8A" stroke-width="1.2"/>
    <text x="48" y="439" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">Wireless CCTV Camera</text>
    <text x="48" y="461" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Wi-Fi compatible camera units for locations where minimal signal cabling is preferred</text>
    <rect x="615" y="428" width="138" height="32" rx="6" fill="#2563EB" fill-opacity="0.2" stroke="#06B6D4" stroke-width="1"/>
    <text x="684" y="448" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="11" font-weight="700">DUAL-ANTENNA WIFI</text>
  </svg>