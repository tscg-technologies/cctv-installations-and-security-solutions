<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
    <defs>
      <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#0A1324"/>
        <stop offset="55%" stop-color="#101D35"/>
        <stop offset="100%" stop-color="#162A4A"/>
      </linearGradient>
      <linearGradient id="metalBody" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#F8FAFC"/>
        <stop offset="55%" stop-color="#E2E8F0"/>
        <stop offset="100%" stop-color="#94A3B8"/>
      </linearGradient>
      <linearGradient id="cyanCone" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.48"/>
        <stop offset="60%" stop-color="#2563EB" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#2563EB" stop-opacity="0.0"/>
      </linearGradient>
      <radialGradient id="blueGlow" cx="50%" cy="45%" r="50%">
        <stop offset="0%" stop-color="#2563EB" stop-opacity="0.32"/>
        <stop offset="100%" stop-color="#101D35" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- Background Canvas -->
    <rect width="800" height="500" fill="url(#bgGrad)"/>
    <circle cx="420" cy="230" r="280" fill="url(#blueGlow)"/>

    <!-- Subtle Technical Grid -->
    <g stroke="#2563EB" stroke-opacity="0.1" stroke-width="1">
      <line x1="0" y1="80" x2="800" y2="80"/>
      <line x1="0" y1="160" x2="800" y2="160"/>
      <line x1="0" y1="240" x2="800" y2="240"/>
      <line x1="0" y1="320" x2="800" y2="320"/>
      <line x1="0" y1="400" x2="800" y2="400"/>
      <line x1="160" y1="0" x2="160" y2="500"/>
      <line x1="320" y1="0" x2="320" y2="500"/>
      <line x1="480" y1="0" x2="480" y2="500"/>
      <line x1="640" y1="0" x2="640" y2="500"/>
    </g>

    <!-- Top Telemetry HUD Bar -->
    <rect x="28" y="24" width="744" height="40" rx="8" fill="#091224" fill-opacity="0.78" stroke="#1E3A8A" stroke-width="1"/>
    <circle cx="50" cy="44" r="5" fill="#10B981"/>
    <text x="64" y="48" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">DEMO PROJECT // RETAIL SECURITY</text>
    <text x="752" y="48" text-anchor="end" fill="#06B6D4" font-family="monospace" font-size="12" font-weight="600">SAMPLE PROJECT #104</text>

    <!-- Main Scene Graphic -->
    
      <!-- Architectural Interior/Exterior Perspective Grid -->
      <g opacity="0.88">
        <rect x="70" y="95" width="660" height="295" rx="14" fill="#0E1B33" stroke="#1E3A8A" stroke-width="1.5"/>
        <!-- Perspective Corridor / Building Lines -->
        <line x1="70" y1="95" x2="250" y2="165" stroke="#2563EB" stroke-opacity="0.35" stroke-width="1.5"/>
        <line x1="730" y1="95" x2="550" y2="165" stroke="#2563EB" stroke-opacity="0.35" stroke-width="1.5"/>
        <line x1="70" y1="390" x2="250" y2="315" stroke="#2563EB" stroke-opacity="0.35" stroke-width="1.5"/>
        <line x1="730" y1="390" x2="550" y2="315" stroke="#2563EB" stroke-opacity="0.35" stroke-width="1.5"/>
        <rect x="250" y="165" width="300" height="150" fill="#132544" stroke="#2563EB" stroke-opacity="0.5" stroke-width="1.5"/>
        <!-- Architectural Windows / Bays -->
        <rect x="275" y="185" width="75" height="110" fill="#091326" stroke="#06B6D4" stroke-opacity="0.4"/>
        <rect x="365" y="185" width="70" height="110" fill="#091326" stroke="#06B6D4" stroke-opacity="0.4"/>
        <rect x="450" y="185" width="75" height="110" fill="#091326" stroke="#06B6D4" stroke-opacity="0.4"/>
      </g>
      <!-- Surveillance Field of View Cone -->
      <polygon points="155,135 245,355 585,345" fill="url(#cyanCone)" opacity="0.55"/>
      <!-- Mounted Unbranded Surveillance Camera Unit -->
      <g transform="translate(115, 105)">
        <rect x="0" y="0" width="24" height="44" rx="4" fill="#334155" stroke="#94A3B8" stroke-width="1.5"/>
        <g transform="rotate(18, 30, 22)">
          <rect x="18" y="6" width="84" height="36" rx="10" fill="url(#metalBody)" stroke="#94A3B8" stroke-width="1.5"/>
          <ellipse cx="100" cy="24" rx="9" ry="17" fill="#091122" stroke="#06B6D4" stroke-width="2"/>
          <circle cx="100" cy="24" r="6" fill="#2563EB"/>
          <circle cx="98" cy="22" r="2" fill="#FFFFFF"/>
        </g>
      </g>
      <!-- Active Detection Overlay Frame -->
      <g stroke="#06B6D4" stroke-width="1.5" fill="none">
        <rect x="335" y="195" width="130" height="105" stroke-dasharray="5 4"/>
        <circle cx="400" cy="247" r="18" stroke="#2563EB" stroke-opacity="0.8"/>
        <circle cx="400" cy="247" r="4" fill="#06B6D4"/>
      </g>
    

    <!-- Bottom Caption & Technical Plate -->
    <rect x="28" y="412" width="744" height="64" rx="10" fill="#091224" fill-opacity="0.86" stroke="#1E3A8A" stroke-width="1.2"/>
    <text x="48" y="439" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">Sample Apparel & Electronics Retail Showroom</text>
    <text x="48" y="461" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Fictional Retail Demo — POS billing counters, display zones, and stockroom entrance</text>
    <rect x="615" y="428" width="138" height="32" rx="6" fill="#2563EB" fill-opacity="0.2" stroke="#06B6D4" stroke-width="1"/>
    <text x="684" y="448" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="11" font-weight="700">8 DOME CAMERAS</text>
  </svg>